<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Starlink Globe · TokenMax</title><style>/*CSS*/</style></head><body>
<canvas id="c"></canvas><div id="banner"></div>
<div id="title" class="card"><h1>🛰️ Starlink Globe</h1><div class="sub" id="src">loading…</div></div>
<div id="stats" class="card"></div>
<div id="over" class="card"><h2 style="margin-top:0">Over Millersville, MD now</h2><div class="muted">39.06° N, 76.64° W · satellites above 25° elevation</div><div class="big" id="ocount">–</div><div class="muted" id="osub"></div><div id="olist"></div></div>
<div id="inspect" class="card"></div>
<div id="time" class="card"><button id="play">⏸</button><button id="now">Now</button>
<select id="speed"><option>1</option><option>10</option><option selected>60</option><option>120</option><option>300</option><option>600</option></select><span class="muted">×</span>
<input id="scrub" type="range" min="-720" max="720" step="1" value="0"><span id="clock"></span></div>
<div id="launches" class="card"></div>
<!--SCRIPTS-->
</body></html>
